name: Daily Crawler Sync

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r apps/backend/requirements.txt
        
    - name: Export Active Companies
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        python apps/backend/scripts/export_companies.py
        
    - name: Install Crawler Dependencies
      run: |
        pip install -r apps/crawler/requirements.txt
        playwright install chromium --with-deps
        
    - name: Run Crawlers
      run: |
        python apps/crawler/scripts/run_crawlers.py
        
    - name: Sync Jobs to Database
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        python apps/backend/scripts/sync_jobs.py
